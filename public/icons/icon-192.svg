<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded rectangle for Android icon mask -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />
  <rect width="186" height="186" x="3" y="3" rx="39" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" />
  
  <!-- Mosque Dome and Minaret Silhouette -->
  <g transform="translate(24, 28)">
    <!-- Crescent Moon -->
    <path d="M 72 8 A 14 14 0 1 1 54 26 A 11 11 0 1 0 72 8 Z" fill="url(#goldGrad)" />
    
    <!-- Central Dome -->
    <path d="M 36 84 C 36 44 64 36 72 28 C 80 36 108 44 108 84 Z" fill="url(#emeraldGrad)" />
    <path d="M 44 84 C 44 52 66 42 72 36 C 78 42 100 52 100 84 Z" fill="url(#goldGrad)" opacity="0.3" />
    <path d="M 72 30 L 72 20" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Left Minaret -->
    <path d="M 12 110 L 16 52 L 20 44 L 24 52 L 28 110 Z" fill="url(#goldGrad)" />
    <path d="M 20 44 L 20 38" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="20" cy="36" r="2.5" fill="url(#goldGrad)" />
    
    <!-- Right Minaret -->
    <path d="M 116 110 L 120 52 L 124 44 L 128 52 L 132 110 Z" fill="url(#goldGrad)" />
    <path d="M 124 44 L 124 38" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="124" cy="36" r="2.5" fill="url(#goldGrad)" />
    
    <!-- Base Arch / Mosque Foundation -->
    <rect x="24" y="84" width="96" height="34" rx="4" fill="#047857" />
    <!-- Islamic Arches -->
    <path d="M 58 118 C 58 100 66 94 72 90 C 78 94 86 100 86 118 Z" fill="#064E3B" stroke="url(#goldGrad)" stroke-width="1.5" />
    <path d="M 38 118 C 38 106 43 102 48 100 C 53 102 58 106 58 118 Z" fill="#064E3B" opacity="0.8" />
    <path d="M 86 118 C 86 106 91 102 96 100 C 101 102 106 106 106 118 Z" fill="#064E3B" opacity="0.8" />
    
    <!-- Base Platform -->
    <rect x="8" y="118" width="128" height="6" rx="3" fill="url(#goldGrad)" />
  </g>
</svg>
